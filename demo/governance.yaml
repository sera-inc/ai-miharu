# Governance decisions for the demo. Fake, like everything else here.
#
# Written to show the four states the register can display, because a demo
# with no governance file shows only the fallback and the feature looks like
# an empty column.
#
# In a real deployment this file is yours, lives wherever you put it, and is
# pointed at by GOVERNANCE_PATH. It never ships with the project: an upstream
# registry has no business implying that a particular tool is approved.

version: 1

tools:

  # Current approval. Reads as approved, with an owner and a date.
  claude:
    status: approved
    owner: 技術部門
    review_due: 2027-06-01
    reason: エンタープライズテナント、DPA締結済み

  # EXPIRED approval. The stored decision is still "approved" and the register
  # shows "reviewing", "approval expired N days ago", and "was approved". This
  # is the case worth looking at: an approval nobody has revisited is not
  # evidence a tool is safe, it is evidence nobody looked.
  chatgpt:
    status: approved
    owner: セキュリティ部門
    review_due: 2026-01-31
    reason: エンタープライズワークスペース、導入時に確認済み

  # Under review.
  cursor:
    status: reviewing
    owner: 技術部門
    review_due: 2027-03-15
    reason: ベンダーの再委託先リストを確認中

  # A refusal. No review date needed.
  ollama:
    status: not_approved
    owner: セキュリティ部門
    reason: ローカルモデル。読み込まれる内容は未確認

  # A decision naming a tool the registry does not know. The register reports
  # it rather than dropping it, because that is also exactly what a typo looks
  # like, and a decision that silently matches nothing is how an organisation
  # believes it has decided something it has not.
  some-unregistered-tool:
    status: not_approved
    owner: セキュリティ部門
    review_due: 2027-09-30
    reason: 2台の端末で確認。ベンダー評価は未実施

# ─────────────────────────────────────────────
# Exceptions
# ─────────────────────────────────────────────
#
# A temporary departure from the general decision, for a stated scope and
# period. The card shows both: the decision stands, and the exception sits
# under it. An exception shown instead of the status would make a note about
# one team read as a decision about everybody.

exceptions:

  # Active. ollama is not approved, and Research has a time-boxed exception.
  EX-001:
    tool: ollama
    scope:
      team: 研究部門
    reason: ローカルモデルの評価。顧客データは使用しない
    owner: セキュリティ部門
    expires: 2027-04-30

  # Expired, and still shown. A record of something decided and then let lapse,
  # which is worth seeing rather than losing. The tool does not become
  # "reviewing" because this ended: nothing about the decision changed.
  EX-002:
    tool: chatgpt
    scope:
      project: 第1四半期キャンペーン
    reason: 顧客向けキャンペーン文面。個人データは使用しない
    owner: マーケティング部門
    expires: 2026-03-31

  # Naming a tool the registry does not know, which the register flags.
  EX-003:
    tool: some-unregistered-tool
    scope:
      team: 技術部門
    reason: ベンダー評価までの試用期間
    owner: セキュリティ部門
    expires: 2027-01-31